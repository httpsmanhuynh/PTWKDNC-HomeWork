<p>service-product-image-event works!</p>

<table border="1">
  <thead>
    <tr>
      <th>Ma San Pham</th>
      <th>Ten San Pham</th>
      <th>Gia San Pham</th>
      <th>Picture</th>
      <th>#</th>
    </tr>
  </thead>

  <tbody>
    @for (p of products; track p.ProductId) {
      <tr>
        <td>{{ p.ProductId }}</td>
        <td>{{ p.ProductName }}</td>
        <td>{{ p.Price }}</td>
        <td>
          <img [src]="p.Image" [alt]="p.ProductName" width="100" height="100" />
        </td>
        <td>
          <button (click)="viewDetail(p)">View Detail</button>
        </td>
      </tr>
    }
  </tbody>
</table>
